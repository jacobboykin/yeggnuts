name: CI (discord-bot)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'discord-bot/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'discord-bot/**'
      - '.github/workflows/**'

jobs:
  build_and_test:
    name: Test, Lint, Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    env:
      CI: true
      DISCORD_BOT_TOKEN: dummy
      DISCORD_APPLICATION_ID: dummy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: discord-bot/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint --if-present

      - name: Check formatting
        run: npm run format:check --if-present

      - name: Run tests
        run: npm test -- --ci

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: build_and_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: discord-bot
          file: discord-bot/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: yeggnuts-discord-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker build -t yeggnuts-discord-bot:test -f discord-bot/Dockerfile discord-bot
          docker run --rm yeggnuts-discord-bot:test node --version

