name: Test (discord-bot)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'discord-bot/**'
  pull_request:
    paths:
      - 'discord-bot/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: discord-bot/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --ci
        env:
          CI: true
          DISCORD_BOT_TOKEN: dummy
          DISCORD_APPLICATION_ID: dummy

